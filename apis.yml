name: Ctrip
description: 'Ctrip (Ctrip.com International / Trip.com Group, NASDAQ: TCOM) is one of the world''s largest
  online travel agencies, founded in 1999 and headquartered in Shanghai, China. Its consumer platform sells
  hotels, flights, train tickets, car rentals, tours, cruises, and travel packages across China and internationally,
  and the broader Trip.com Group also operates the Trip.com, Qunar, and Skyscanner brands. Ctrip exposes partner
  and B2B travel-distribution capabilities through the Ctrip Open Platform (openapi.ctrip.com), the Trip.com
  Group open platform (connect.trip.com), and a corporate-travel developer platform (ctripbiz). These developer
  surfaces are partner-gated and largely account-restricted; no public OpenAPI or first-party SDK has been
  discovered for this profile.'
